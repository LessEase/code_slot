# ── 全局配置 ─────────────────────────────────────────────────────
universe:
  # A 股 universe 模式：
  #   "all"   = 全市场扫描（沪/深主板 + 创业板 + 科创板，默认排除北交所）
  #   "index" = 仅指数成分股（用 a_share_index 指定，如沪深300）
  a_share_universe: "all"
  a_share_index: "000300"   # 仅 a_share_universe == "index" 时生效
  # 全市场扫描时启用的板块；BSE_MAIN (北交所) 默认不启用——规则不同（30%涨跌幅、100股门槛）
  a_share_boards: ["SH_MAIN", "SZ_MAIN", "ChiNext", "STAR"]
  a_share_limit: 0          # 0 = 不限；>0 则取前 N 只（按代码字典序，调试用）
  # 历史下载并发度（AKShare 单线程很慢；并发 8 通常 OK，过高易被限流）
  fetch_workers: 8

  # 美股：标普500成分股
  us_market: true
  us_stock_list:            # 为空则自动从 Wikipedia 获取标普500列表
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - NVDA
    - META
    - TSLA
    - JPM
    - V
    - UNH

data:
  lookback_days: 120        # 计算指标所需历史天数
  cache_dir: "data/cache"   # 本地缓存目录
  cache_ttl_hours: 12       # 缓存有效期（小时）

# ── 技术指标参数 ─────────────────────────────────────────────────
indicators:
  ma_periods: [5, 10, 20, 60]
  ema_periods: [12, 26]
  macd:
    fast: 12
    slow: 26
    signal: 9
  rsi_period: 14
  bbands:
    period: 20
    std: 2.0
  atr_period: 14
  volume_ma_period: 20

# ── 选股评分权重 ─────────────────────────────────────────────────
scoring:
  weights:
    trend: 0.30       # MA 排列
    momentum: 0.30    # MACD + RSI
    volume: 0.20      # 量价配合
    volatility: 0.20  # 布林带 + ATR
  top_n: 10           # 每次选出 Top N 只

# ── 组合管理 ─────────────────────────────────────────────────────
portfolio:
  initial_capital: 1000000.0   # 初始资金（人民币，美股按汇率换算）
  usd_cny_rate: 7.2            # 美元兑人民币（固定汇率，仅模拟用）
  max_positions: 20            # 最大持仓数量
  position_size_pct: 0.05      # 单只股票最大仓位比例（5%）
  commission_rate: 0.0003      # 佣金率（A股）
  us_commission_per_share: 0.005  # 美股每股佣金（USD）
  min_commission: 1.0          # 最低佣金（USD）

# ── 风险控制 ─────────────────────────────────────────────────────
risk:
  stop_loss_pct: 0.05          # 固定止损：亏损 5% 即止损
  trailing_stop_pct: 0.08      # 追踪止损：从最高点回撤 8% 止损
  max_hold_days: 30            # 最长持仓天数
  max_portfolio_drawdown: 0.15 # 组合最大回撤（达到则停止新建仓）

# ── 调度器 ───────────────────────────────────────────────────────
scheduler:
  # A股：每个交易日 16:00 收盘后运行
  a_share_cron: "0 16 * * 1-5"
  # 美股：每个交易日 22:00（北京时间，美东盘后）运行
  us_stock_cron: "0 22 * * 1-5"
  timezone: "Asia/Shanghai"

# ── ML Pipeline ──────────────────────────────────────────────────
ml_pipeline:
  # ── 数据 ──────────────────────────────────────────────────────
  history_years: 3            # 历史数据年数（用于训练）
  history_dir: "data/history" # 历史 OHLCV 存储目录
  model_dir: "data/models"    # 模型存储目录

  # ── 样本标签 ──────────────────────────────────────────────────
  forward_days: 5             # 预测 N 天后的涨跌
  return_threshold: 0.03      # 标签=1 的条件：N天涨幅 > 3%

  # ── 训练方案 ──────────────────────────────────────────────────
  train_years: 2.0            # walk-forward 训练窗口（年）
  test_months: 3              # walk-forward 测试窗口（月）

  # ── LightGBM 超参 ─────────────────────────────────────────────
  lgbm:
    n_estimators: 500
    learning_rate: 0.05
    num_leaves: 31
    max_depth: 6
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1
    early_stopping_rounds: 50

  # ── 回测 ──────────────────────────────────────────────────────
  rebalance_days: 5           # 每 N 个交易日调仓一次
  top_n: 10                   # 每次选出 Top N 只
  min_hold_days: 2            # 最少持仓天数（避免频繁换手）

  # ── 真实化（避免 in-sample 偏差和零滑点）─────────────────────
  backtest_holdout_months: 12 # 训练时排除最近 N 个月作为严格 OOS 回测窗口
  execution_lag_days: 1       # 信号在 t 日产生，t+lag 个交易日的收盘价成交
  slippage_bps: 10            # 单边滑点（基点），10 bps = 0.10%
  # A 股板块各自的日涨跌幅上限（用于过滤"封板当日不可成交"的 fill）：
  #   SH_MAIN / SZ_MAIN：主板 10%
  #   ChiNext / STAR：创业板/科创板 20% (2020 改革后)
  #   ST：风险警示股 5% (universe 里若含 ST 需配上)
  a_share_price_limits:
    SH_MAIN: 0.095
    SZ_MAIN: 0.095
    ChiNext: 0.195
    STAR: 0.195
    ST: 0.045
    DEFAULT: 0.095

  # ── 流动性过滤（point-in-time，无未来函数）────────────────────
  # 仅交易过去 N 日均成交额超过阈值的股票；避免极低流动性票造成 fill 不真实
  min_avg_turnover_cny: 50000000   # 5000 万 CNY
  turnover_window_days: 20
